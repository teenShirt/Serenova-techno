name: CI/CD Pipeline - Deploy to VPS

# 1. Triggers: Run pipeline automatically when pushing code to the 'main' branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Stage 1: Continuous Integration (CI) - Test & Build
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run Linter (Code Quality Check)
        run: npm run lint || echo "Linter warning ignored"

      - name: 🏗️ Build React Frontend
        run: npm run build

  # Stage 2: Continuous Deployment (CD) - Deploy to Linux Server via SSH
  deploy:
    name: 🚀 Deploy to VPS Server
    needs: build-and-test # Only runs if build-and-test stage succeeds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: 🔑 Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "Starting deployment on server..."
            
            # Navigate to project directory on server
            cd /opt/sernova/Serenova-techno || exit 1
            
            # Pull latest changes from GitHub
            git pull origin main
            
            # Install dependencies
            npm ci
            
            # Build React frontend
            npm run build
            
            # Reload PM2 application seamlessly (zero downtime)
            pm2 reload ecosystem.config.cjs --env production --update-env
            
            echo "✅ Deployment completed successfully!"
