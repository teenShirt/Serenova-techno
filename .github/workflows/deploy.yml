name: CI/CD Pipeline - Deploy Serenova Tech

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Linter warning ignored"

      - name: Build React frontend
        run: npm run build

  deploy:
    name: Deploy to VMware Server
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Deploy Serenova Tech
        run: |
          echo "Starting deployment..."

          cd /opt/sernova/Serenova-techno

          git fetch origin
          git reset --hard origin/main

          npm ci
          npm run build

          pm2 reload ecosystem.config.cjs --env production --update-env
          pm2 save

          echo "Deployment completed successfully!"
